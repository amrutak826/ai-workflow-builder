table:
  schema: public
  name: workflow_triggers
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
select_permissions:
  - role: user
    permission:
      # webhook_secret is deliberately excluded — never readable over GraphQL,
      # only used server-side by the webhook Action to authenticate callers.
      columns:
        - id
        - workflow_id
        - type
        - config
        - is_enabled
        - created_at
      filter:
        workflow:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      columns:
        - workflow_id
        - type
        - config
        - is_enabled
      # Layer 2: a webhook trigger is an inbound endpoint into the org's
      # data — owner only. manual/scheduled/database_event triggers only
      # need editor+.
      check:
        _or:
          - _and:
              - type:
                  _in: [manual, scheduled, database_event]
              - workflow:
                  organization:
                    members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _in: [owner, editor]
          - _and:
              - type:
                  _eq: webhook
              - workflow:
                  organization:
                    members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: owner
update_permissions:
  - role: user
    permission:
      columns:
        - config
        - is_enabled
      filter:
        _or:
          - _and:
              - type:
                  _in: [manual, scheduled, database_event]
              - workflow:
                  organization:
                    members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _in: [owner, editor]
          - _and:
              - type:
                  _eq: webhook
              - workflow:
                  organization:
                    members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: owner
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        workflow:
          organization:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner
