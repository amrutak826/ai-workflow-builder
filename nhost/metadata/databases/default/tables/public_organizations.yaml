table:
  schema: public
  name: organizations
array_relationships:
  - name: members
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          schema: public
          name: org_members
  - name: workflows
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          schema: public
          name: workflows
  - name: runs
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          schema: public
          name: workflow_runs
select_permissions:
  - role: user
    permission:
      # Layer 1: any member of the org (any role) may view org-level info,
      # e.g. quota, on their own org only.
      columns:
        - id
        - name
        - quota_limit
        - quota_used
        - quota_period_start
        - created_at
        - updated_at
      filter:
        members:
          user_id:
            _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      # Only an owner can rename the org / adjust settings via GraphQL.
      # quota_used is intentionally NOT in this column list — it is only
      # ever mutated by the triggerWorkflowRun Action using the admin secret.
      columns:
        - name
      filter:
        members:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: owner
      check: null
